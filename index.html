      {id:"c5",name:"João Pedro Lima",contact:"joao.lima@email.com",initials:"JL",color:"#dce4ed",textColor:"#435a75",channel:"Site",channelColor:"#7a92bd",time:"Seg",unread:0,archived:false,online:false,email:"joao.lima@email.com",customerSince:"Fevereiro de 2026",orders:0,tags:["Dúvida de produto"],messages:[{from:"them",time:"Seg",text:"A carteira masculina tem espaço para CNH e cartões?"},{from:"us",time:"Seg",text:"Tem sim, João! São 6 espaços para cartões, compartimento para notas e um bolso transparente para documento."}]}
    ];
    const storageKey="g-bolsas-conversas-v1";
    let conversations;
    try{const saved=localStorage.getItem(storageKey);conversations=saved?JSON.parse(saved):starterConversations;if(!Array.isArray(conversations))conversations=starterConversations}catch{conversations=starterConversations}
    let activeId=conversations[0]?.id??null,activeFilter="all",toastTimer;
    const app=document.getElementById("app"),list=document.getElementById("conversationList"),thread=document.getElementById("thread"),input=document.getElementById("messageInput"),modalBackdrop=document.getElementById("modalBackdrop");
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const activeConversation=()=>conversations.find(conversation=>conversation.id===activeId);
    const latestMessage=conversation=>conversation.messages.at(-1)?.text??"Conversa iniciada";
    const initialsFrom=name=>name.trim().split(/\s+/).slice(0,2).map(part=>part[0]).join("").toUpperCase();
    function persist(){try{localStorage.setItem(storageKey,JSON.stringify(conversations))}catch{showToast("Não foi possível salvar neste navegador.")}}
    function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2400)}
    function renderList(){
      const query=document.getElementById("search").value.trim().toLocaleLowerCase("pt-BR");
      const visible=conversations.filter(conversation=>{const matchesFilter=activeFilter==="archived"?conversation.archived:!conversation.archived&&(activeFilter!=="unread"||conversation.unread>0);const matchesQuery=`${conversation.name} ${conversation.contact} ${latestMessage(conversation)}`.toLocaleLowerCase("pt-BR").includes(query);return matchesFilter&&matchesQuery}).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      if(!visible.length){list.innerHTML=`<p class="empty-list">${activeFilter==="archived"?"Nenhuma conversa arquivada.":"Nenhuma conversa encontrada."}</p>`;return}
      list.innerHTML=visible.map(conversation=>`<button class="conversation ${conversation.id===activeId?"selected":""}" data-id="${escapeHtml(conversation.id)}" aria-label="Abrir conversa com ${escapeHtml(conversation.name)}"><span class="person-avatar" style="--avatar-bg:${escapeHtml(conversation.color)};--avatar-color:${escapeHtml(conversation.textColor)}">${escapeHtml(conversation.initials)}${conversation.online?'<i class="online-dot"></i>':""}</span><span class="conversation-copy"><span class="conversation-top"><span class="person-name">${escapeHtml(conversation.name)}</span><span class="time">${escapeHtml(conversation.time)}</span></span><span class="conversation-bottom"><span class="preview">${escapeHtml(latestMessage(conversation))}</span>${conversation.unread?`<span class="unread">${conversation.unread}</span>`:""}</span><span class="channel"><i class="channel-mark" style="--channel-color:${escapeHtml(conversation.channelColor)}"></i>${escapeHtml(conversation.channel)}</span></span></button>`).join("");
    }
    function renderDetails(conversation){document.getElementById("contactDetails").innerHTML=`<section class="contact-profile"><div class="profile-avatar" style="background:${escapeHtml(conversation.color)};color:${escapeHtml(conversation.textColor)}">${escapeHtml(conversation.initials)}</div><h3>${escapeHtml(conversation.name)}</h3><p>${escapeHtml(conversation.contact)}</p><div class="contact-actions"><button class="contact-action" data-contact-action="ligar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.4 2.8a2 2 0 0 1-.6 1.7L7.6 9.5a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.7-.6l2.8.4a2 2 0 0 1 1.6 1.9z"/></svg>Ligar</button><button class="contact-action" data-contact-action="email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>E-mail</button><button class="contact-action" data-contact-action="copiar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Copiar</button></div></section><section class="detail-section"><p class="detail-label">Relacionamento</p><p class="detail-value"><span>Cliente desde</span>${escapeHtml(conversation.customerSince)}</p><p class="detail-value"><span>Pedidos realizados</span>${conversation.orders}</p></section><section class="detail-section"><p class="detail-label">Etiquetas</p>${conversation.tags.map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join("")}</section>${conversation.orders?`<section class="detail-section"><p class="detail-label">Último pedido</p><div class="order-link"><span>Bolsa artesanal · entregue</span><b>#${String(2418+conversation.orders).padStart(4,"0")}</b></div></section>`:""}`}
    function renderThread(){
      const conversation=activeConversation();if(!conversation){document.getElementById("chatName").textContent="Selecione uma conversa";thread.innerHTML="";return}
      document.getElementById("chatName").textContent=conversation.name;document.getElementById("chatStatus").innerHTML=conversation.online?'<span class="status"></span>Online agora':`Cliente via ${escapeHtml(conversation.channel)}`;
      const avatar=document.getElementById("headerAvatar");avatar.style.setProperty("--avatar-bg",conversation.color);avatar.style.setProperty("--avatar-color",conversation.textColor);avatar.querySelector("span").textContent=conversation.initials;avatar.querySelector(".online-dot").style.display=conversation.online?"block":"none";
      document.getElementById("archiveConversation").title=conversation.archived?"Desarquivar conversa":"Arquivar conversa";document.getElementById("archiveConversation").setAttribute("aria-label",conversation.archived?"Desarquivar conversa":"Arquivar conversa");document.getElementById("chat").classList.toggle("archived",conversation.archived);
      thread.innerHTML='<div class="day-divider">Hoje, 4 de outubro</div>'+conversation.messages.map(message=>{const outgoing=message.from==="us",product=message.product?'<div class="product-card"><div class="product-swatch"><svg width="34" height="38" viewBox="0 0 40 44" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 13h24l2 27H6l2-27zM14 14V9a6 6 0 0 1 12 0v5M12 22h16"/><path d="M15 30h10"/></svg></div><div><small>COLEÇÃO AUTORAL</small><strong>Bolsa Aurora</strong><small>Couro legítimo · R$ 489</small></div></div>':"";return `<div class="message-row ${outgoing?"outgoing":"incoming"}">${outgoing?"":`<span class="message-avatar">${escapeHtml(conversation.initials)}</span>`}<div class="bubble-wrap">${product}<div class="bubble">${escapeHtml(message.text)}</div><div class="message-meta">${escapeHtml(message.time)} ${outgoing?'<span class="message-check">✓✓</span>':""}</div></div></div>`}).join("");renderDetails(conversation);thread.scrollTop=thread.scrollHeight;
    }
    function selectConversation(id){activeId=id;const conversation=activeConversation();if(conversation)conversation.unread=0;renderList();renderThread();persist();app.classList.add("mobile-chat")}
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{activeFilter=tab.dataset.filter;document.querySelectorAll(".tab").forEach(item=>{item.classList.toggle("active",item===tab);item.setAttribute("aria-selected",String(item===tab))});renderList()}));
    list.addEventListener("click",event=>{const button=event.target.closest(".conversation");if(button)selectConversation(button.dataset.id)});document.getElementById("search").addEventListener("input",renderList);
    document.getElementById("messageForm").addEventListener("submit",event=>{event.preventDefault();const conversation=activeConversation(),text=input.value.trim();if(!conversation||!text||conversation.archived)return;const now=new Date();conversation.messages.push({from:"us",text,time:now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});conversation.time=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});conversation.updatedAt=now.getTime();input.value="";renderThread();renderList();persist()});
    input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();document.getElementById("messageForm").requestSubmit()}});
    document.getElementById("newConversation").addEventListener("click",()=>{modalBackdrop.classList.add("open");document.getElementById("newName").focus()});document.getElementById("cancelModal").addEventListener("click",()=>modalBackdrop.classList.remove("open"));modalBackdrop.addEventListener("click",event=>{if(event.target===modalBackdrop)modalBackdrop.classList.remove("open")});
    document.getElementById("newConversationForm").addEventListener("submit",event=>{event.preventDefault();const data=new FormData(event.currentTarget),name=String(data.get("name")).trim(),contact=String(data.get("contact")).trim(),initials=initialsFrom(name),conversation={id:crypto.randomUUID(),name,contact,initials,color:"#e4e8dc",textColor:"#4e604e",channel:"Atendimento",channelColor:"#829b78",time:"Agora",unread:0,archived:false,online:false,email:contact.includes("@")?contact:"Não informado",customerSince:"Hoje",orders:0,tags:["Novo contato"],messages:[]};conversations.unshift(conversation);activeFilter="all";document.querySelectorAll(".tab").forEach(tab=>{const selected=tab.dataset.filter==="all";tab.classList.toggle("active",selected);tab.setAttribute("aria-selected",String(selected))});activeId=conversation.id;event.currentTarget.reset();modalBackdrop.classList.remove("open");renderList();renderThread();persist();app.classList.add("mobile-chat");input.focus()});
    document.getElementById("archiveConversation").addEventListener("click",()=>{const conversation=activeConversation();if(!conversation)return;conversation.archived=!conversation.archived;if(conversation.archived&&activeFilter!=="archived"){const next=conversations.find(item=>!item.archived&&item.id!==conversation.id);activeId=next?.id??null}renderList();renderThread();persist();showToast(conversation.archived?"Conversa arquivada.":"Conversa desarquivada.")});
    document.getElementById("mobileBack").addEventListener("click",()=>app.classList.remove("mobile-chat"));document.getElementById("emojiButton").addEventListener("click",()=>{input.value+="♡";input.focus()});document.getElementById("quickReply").addEventListener("click",()=>{input.value=input.value?`${input.value} `:"Oi! Obrigada por chamar a gente. Como posso ajudar? ";input.focus()});
    document.getElementById("searchMessages").addEventListener("click",()=>{const query=window.prompt("Buscar nesta conversa:");if(query===null||!query.trim())return;const found=activeConversation()?.messages.find(message=>message.text.toLocaleLowerCase("pt-BR").includes(query.trim().toLocaleLowerCase("pt-BR")));showToast(found?`Mensagem encontrada às ${found.time}.`:"Nenhuma mensagem encontrada.")});
    document.getElementById("showContact").addEventListener("click",()=>{if(window.innerWidth<=1180)showToast("Dados do contato disponíveis em telas maiores.");else document.getElementById("details").scrollIntoView({behavior:"smooth"})});document.getElementById("closeDetails").addEventListener("click",()=>{document.getElementById("details").style.display="none";document.querySelector(".app").style.gridTemplateColumns="76px 350px minmax(340px,1fr)"});
    document.getElementById("contactDetails").addEventListener("click",async event=>{const action=event.target.closest("[data-contact-action]")?.dataset.contactAction,conversation=activeConversation();if(!action||!conversation)return;if(action==="copiar"){try{await navigator.clipboard.writeText(conversation.contact);showToast("Contato copiado.")}catch{showToast(conversation.contact)}}else if(action==="email"){if(conversation.email!=="Não informado")window.location.href=`mailto:${encodeURIComponent(conversation.email)}`;else showToast("Este contato não tem e-mail cadastrado.")}else if(action==="ligar"){const phone=conversation.contact.replace(/[^+\d]/g,"");if(phone)window.location.href=`tel:${phone}`;else showToast("Este contato não tem telefone cadastrado.")}});
    renderList();renderThread();
  </script>
